<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chakra E-Trans | Select Your Depot</title>
<meta name="description" content="Chakra E-Trans, Karimnagar. Boundless Journeys, Embracing All. Select your depot.">
<meta name="theme-color" content="#0b1f3a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* ===== 1. Design tokens ===== */
:root {
  --navy: #0b1f3a;
  --navy-soft: #1c3557;
  --green: #1fa95b;
  --green-bright: #2ee27d;
  --white: #ffffff;
  --glass: rgba(255, 255, 255, 0.55);
  --glass-edge: rgba(255, 255, 255, 0.75);
  --font: "Sora", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --card-size: min(44vw, 440px, calc((100vh - 400px) * 1.15));
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font);
  color: var(--navy);
  background: var(--navy);
  overflow-x: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ===== 2. Fixed blurred background (image + soft white/green overlay) ===== */
.bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: url("bg.png") center / cover no-repeat;
  filter: blur(9px);
  transform: scale(1.06); /* hides blurred edges */
}
.bg-overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 15% 10%, rgba(46, 226, 125, 0.30), transparent 55%),
    radial-gradient(circle at 90% 95%, rgba(31, 169, 91, 0.25), transparent 50%),
    linear-gradient(160deg, rgba(255, 255, 255, 0.62), rgba(226, 247, 236, 0.55));
}

/* ===== 3. Layout shell ===== */
.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(12px, 2.5vw, 28px);
}

/* Glass content layer: the only element using backdrop-filter */
.glass {
  width: 100%;
  max-width: 1100px;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(18px, 3vh, 32px);
  padding: clamp(20px, 3.5vw, 44px) clamp(16px, 3vw, 44px);
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--glass-edge);
  border-radius: 28px;
  box-shadow: 0 24px 60px rgba(11, 31, 58, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

/* ===== 4. Branding ===== */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
}
.brand-mark {
  width: 64px;
  height: 64px;
  animation: spin 24s linear infinite; /* slow, quiet wheel */
}
.brand h1 {
  font-size: clamp(1.7rem, 5.2vw, 3rem);
  font-weight: 800;
  letter-spacing: 0.06em;
  color: var(--navy);
  line-height: 1.1;
}
.brand h1 span { color: var(--green); }
.brand .place {
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--navy-soft);
}
.brand .tagline {
  margin-top: 4px;
  font-size: clamp(0.95rem, 2.4vw, 1.15rem);
  font-weight: 400;
  font-style: italic;
  color: var(--green);
}
.brand .tagline::before,
.brand .tagline::after {
  content: "";
  display: inline-block;
  width: 28px;
  height: 2px;
  margin: 0 10px;
  vertical-align: middle;
  background: linear-gradient(90deg, transparent, var(--green));
}
.brand .tagline::after { background: linear-gradient(270deg, transparent, var(--green)); }

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 5. Heading ===== */
.select-title {
  font-size: clamp(1rem, 2.6vw, 1.35rem);
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--navy);
  text-align: center;
}
.select-title::after {
  content: "";
  display: block;
  width: 56px;
  height: 3px;
  margin: 10px auto 0;
  border-radius: 3px;
  background: var(--green);
}

/* ===== 6. Depot cards ===== */
.cards {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(18px, 3.5vw, 44px);
  flex-wrap: wrap;
}

.card {
  position: relative;
  display: block;
  width: var(--card-size);
  min-width: 240px;
  aspect-ratio: 1 / 1;
  border-radius: 24px;
  overflow: hidden;
  text-decoration: none;
  color: var(--white);
  cursor: pointer;
  isolation: isolate;
  border: 2px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 14px 34px rgba(11, 31, 58, 0.28);
  transition: transform 0.4s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s ease, border-color 0.4s ease;
  -webkit-tap-highlight-color: transparent;
}

/* Depot image: never blurred, zooms on hover */
.card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  transition: transform 0.9s cubic-bezier(.2,.8,.2,1);
}

/* Dark gradient so the title stays readable on any photo */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(to top, rgba(11, 31, 58, 0.92) 0%, rgba(11, 31, 58, 0.55) 38%, rgba(11, 31, 58, 0) 70%);
  transition: opacity 0.4s ease;
}

/* Pointer-following glow (position set by JS) */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  opacity: 0;
  background: radial-gradient(circle 180px at var(--mx, 50%) var(--my, 50%), rgba(46, 226, 125, 0.28), transparent 70%);
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.card-body {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: clamp(16px, 2.6vw, 26px);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}
.card-title {
  font-size: clamp(1.15rem, 2.6vw, 1.65rem);
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 1.15;
}
.card-sub {
  margin-top: 4px;
  font-size: clamp(0.78rem, 1.7vw, 0.95rem);
  color: rgba(255, 255, 255, 0.82);
}


/* Hover + keyboard focus + touch press */
.card:hover,
.card:focus-visible {
  transform: translateY(-10px);
  border-color: var(--green-bright);
  box-shadow:
    0 26px 50px rgba(11, 31, 58, 0.35),
    0 0 0 3px rgba(46, 226, 125, 0.55),
    0 0 38px 6px rgba(46, 226, 125, 0.55);
  outline: none;
}
.card:hover img,
.card:focus-visible img { transform: scale(1.12); }
.card:hover::after,
.card:focus-visible::after { opacity: 1; }
.card:active { transform: translateY(-4px) scale(0.99); }


/* ===== 7. Footer ===== */
.footer {
  margin-top: auto;
  padding-top: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy-soft);
  text-align: center;
}

/* ===== 8. Page-load entrance (one orchestrated sequence) ===== */
.reveal { opacity: 0; transform: translateY(18px); animation: rise 0.8s cubic-bezier(.2,.8,.2,1) forwards; }
.d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.2s; }
.d3 { animation-delay: 0.35s; } .d4 { animation-delay: 0.5s; } .d5 { animation-delay: 0.7s; }
@keyframes rise { to { opacity: 1; transform: none; } }

/* ===== 9. Responsive ===== */
@media (max-width: 900px) {
  :root { --card-size: min(70vw, 400px); }
  .cards { flex-direction: column; flex-wrap: nowrap; }
}
@media (max-width: 480px) {
  :root { --card-size: min(100%, 360px); }
  .glass { border-radius: 22px; }
  .card { min-width: 0; width: min(100%, 360px); }
  .brand-mark { width: 52px; height: 52px; }
  .brand .tagline::before, .brand .tagline::after { display: none; }
}

/* ===== 10. Accessibility ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: rgba(255, 255, 255, 0.82); }
}
</style>
</head>

<body>
  <!-- Blurred background layers -->
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="page">
    <div class="glass">

      <!-- Company branding -->
      <header class="brand reveal d1">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="none" stroke="#0b1f3a" stroke-width="3"/>
          <circle cx="32" cy="32" r="6" fill="#1fa95b"/>
          <g stroke="#1fa95b" stroke-width="3" stroke-linecap="round">
            <path d="M32 6v14M32 44v14M6 32h14M44 32h14"/>
            <path d="M13.6 13.6l9.9 9.9M40.5 40.5l9.9 9.9M13.6 50.4l9.9-9.9M40.5 23.5l9.9-9.9" stroke="#0b1f3a"/>
          </g>
        </svg>
        <h1>CHAKRA <span>E-TRANS</span></h1>
        <p class="place">Karimnagar</p>
        <p class="tagline">Boundless Journeys, Embracing All</p>
      </header>

      <h2 class="select-title reveal d2">SELECT YOUR DEPOT</h2>

      <!-- Depot selection: the whole card is the link -->
      <main class="cards">

        <a class="card reveal d3" href="knr.html" aria-label="Enter Karimnagar Depot">
          <img src="knr.png" alt="Karimnagar Depot" loading="eager" decoding="async">
          <div class="card-body">
            <div>
              <h3 class="card-title">KARIMNAGAR DEPOT</h3>
              <p class="card-sub">Karimnagar Operations</p>
            </div>
          </div>
        </a>

        <a class="card reveal d4" href="kp.html" aria-label="Enter Kukatpally Depot">
          <img src="kp.png" alt="Kukatpally Depot" loading="eager" decoding="async">
          <div class="card-body">
            <div>
              <h3 class="card-title">KUKATPALLY DEPOT</h3>
              <p class="card-sub">Kukatpally Operations</p>
            </div>
          </div>
        </a>

      </main>

      <footer class="footer reveal d5">Powered by Chakra E-Trans | Karimnagar</footer>
    </div>
  </div>

<script>
/* Pointer-following green glow on each card (CSS reads --mx / --my). */
(function () {
  'use strict';
  document.querySelectorAll('.card').forEach(function (card) {
    card.addEventListener('pointermove', function (e) {
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
})();
</script>
</body>
</html>
