<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAKRA E-TRANS – Centralized Transport Operations Dashboard</title>
<style>
/* CHAKRA E-TRANS — navy & white theme */
:root{--navy:#132b66;--navy2:#1d3c8f;--bg:#f4f6f9;--c:#fff;--t:#1b2530;--m:#5d6b7a;--b:#dde3ea;--p:#132b66;--ok:#17803d;--bad:#c0392b;--w:#b7791f;
--bd2:#cbd5e1;--hd:#132b66;--hdt:#e8eef8;--zebra:#f8fafc;--hov:#e8eef8}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
[hidden]{display:none!important}
button,.btn,select,input{font:inherit;padding:6px 10px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t)}
button,.btn{cursor:pointer;transition:background .12s,border-color .12s}
button:hover:not(:disabled),.btn:hover{border-color:var(--navy)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-within{outline:2px solid var(--navy2);outline-offset:1px}
.pri{background:var(--p);color:#fff;border-color:var(--p)}
.pri:hover:not(:disabled){background:var(--navy2)}
.danger{color:var(--bad)}
.mut{color:var(--m)}
/* ---------- header ---------- */
.app-h{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:38px;height:38px;border:2px solid #fff;border-radius:8px;display:grid;place-items:center;font-weight:800;letter-spacing:.5px}
.ttl h1{margin:0;font-size:22px;letter-spacing:.06em}
.ttl small{display:block;font-size:11.5px;letter-spacing:.14em;opacity:.85}
.app-h nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nb{background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:6px;padding:7px 14px}
.nb:hover:not(:disabled){background:#ffffff1f;border-color:#fff}
.nb.dark{color:var(--navy);border-color:var(--navy)}
.nb.dark:hover:not(:disabled){background:#132b6614;border-color:var(--navy)}
#depSel option{color:#1b2530;background:#fff}
#banner .warn{margin:0;border-radius:0}
.meta{color:var(--m);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;background:#fff}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--bd2)}
.chip.ok i{background:var(--ok)}.chip.none i{background:#c9d1da}
.chip em{font-style:normal;color:var(--m)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip.on em{color:#cfd9f0}
.chip.all{font-weight:600}
/* ---------- depot dashboard ---------- */
#depotView{display:flex;flex-direction:column;animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.dbar{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--b);background:#fff;flex-wrap:wrap}
.dbar b{color:var(--navy);font-size:15px}
main{padding:12px 16px;max-width:1500px;width:100%;margin:0 auto}
.info{color:var(--m);font-size:12.5px;margin:2px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;cursor:pointer}
.card:hover{border-color:var(--navy)}
.card small{color:var(--m);display:block}.card b{font-size:22px}.card i{display:block;font-size:11px;color:var(--m);font-style:normal}
h3{margin:18px 0 6px;font-size:15px}
.tw{overflow-x:auto;background:var(--c);border:1px solid var(--bd2);border-radius:8px;box-shadow:0 1px 2px #0f172a0a}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border:1px solid var(--bd2);text-align:left;white-space:nowrap}
th{cursor:pointer;background:var(--hd);color:var(--hdt);font-weight:650;font-size:11px;letter-spacing:.03em;text-transform:uppercase;text-align:center;position:sticky;top:0;border-color:#0a1a3a;user-select:none}
th:hover{filter:brightness(1.15)}
td{text-align:center;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-weight:600}
td.n{text-align:right}
tbody tr:nth-child(even) td{background:var(--zebra)}
tr.ck{cursor:pointer}tr.ck:hover td{background:var(--hov)}
.pg{padding:8px 10px;color:var(--m);font-size:12px;border-top:1px solid var(--bd2)}.pg button{padding:1px 8px}
.s-ok{color:var(--ok);font-weight:600}.s-bad{color:var(--bad);font-weight:600}.s-w{color:var(--w);font-weight:600}
.cv{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;height:280px}
.cv canvas{max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid .cv{min-width:0}
#view .grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.warn{background:#fff4e0;color:#6b4500;border:1px solid #f0c36d;border-radius:6px;padding:8px;margin:6px 0}
.warn.plain{background:var(--c);color:var(--t);border-color:var(--b)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:8px}.mg label{font-size:12px;color:var(--m)}.mg select{width:100%}
details{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px}
.emptybox{background:#fff;border:1px dashed var(--bd2);border-radius:12px;padding:36px 16px;text-align:center;color:var(--m)}
.emptybox strong{display:block;font-size:17px;color:var(--navy);margin-bottom:6px}
.emptybox .chips{justify-content:center}
/* ---------- modals, toasts, busy ---------- */
.modal{display:none;position:fixed;inset:0;background:#0b1530a8;align-items:center;justify-content:center;z-index:9;padding:8px}
.mb{background:var(--bg);padding:16px;border-radius:10px;width:min(1100px,96vw);max-height:90vh;overflow:auto}
.mb h3:first-child{margin-top:0}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.form{display:grid;gap:10px;max-width:560px}.form label{display:grid;gap:3px;font-size:12.5px;font-weight:600;color:var(--navy)}.form small{font-weight:400;color:var(--m)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:1px solid var(--b);border-radius:8px;background:#fff;padding:8px 10px;margin:0}
legend{font-weight:600;color:var(--navy);padding:0 4px}
.ck{display:flex;align-items:center;gap:6px;padding:2px 0}.ck input{padding:0}
.dlist{max-height:220px;overflow:auto}
.lnk{border:0;background:none;color:var(--navy2);padding:0 4px;text-decoration:underline;font-size:12px}
.acts{white-space:nowrap}
#busy{display:none;position:fixed;inset:0;background:#0b1530a8;color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:16px;z-index:20}
.spin{width:38px;height:38px;border:4px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:min(420px,calc(100vw - 28px))}
.toast{background:#fff;border-left:5px solid var(--ok);box-shadow:0 4px 16px #0003;border-radius:6px;padding:10px 12px;animation:fade .15s ease}
.toast.err{border-color:var(--bad)}.toast.warn{border-color:var(--w)}
#printArea{display:none}
/* ---------- responsive ---------- */
@media(max-width:700px){
 .ttl h1{font-size:18px}.app-h{padding:10px 12px}.app-h nav{margin-left:0;width:100%}
 .cols2{grid-template-columns:1fr}
 main{padding:8px}
 .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap}
 .cards{grid-template-columns:repeat(2,1fr)}
}
/* ---------- print (A4) ---------- */
@media print{
 .np,.app-h{display:none!important}
 @page{size:A4;margin:10mm}
 body{font-size:10px;background:#fff}
 .modal,#busy,#toasts{display:none!important}
 #depotView{display:block!important}
 .tw{overflow:visible}.cv{height:220px;break-inside:avoid}
 th,tbody tr:nth-child(even) td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.print-cons #depotView{display:none!important}
 body.print-cons #printArea{display:block}
 #printArea h1{font-size:16px;color:var(--navy)}#printArea h2{font-size:13px;color:var(--navy)}
 #printArea table{font-size:8.5px}#printArea th{cursor:default;position:static}#printArea td.n{text-align:right}
}

/* ===== UI REFRESH (reference-matched layer; appended last so it overrides) ===== */
:root{--navy:#0f2a5f;--navy2:#1e56c8;--bg:#eaf0f8;--b:#e1e8f2;--bd2:#d5deea;--hd:#0f2a5f;--rad:14px;--sh:0 1px 3px #0f2a5f14,0 4px 14px #0f2a5f0d}
body{background:var(--bg);font:13.5px/1.4 "Segoe UI",system-ui,Roboto,sans-serif}
button,select,input,.btn{border-radius:10px;border-color:var(--bd2);min-height:34px}
select,input:not([type=checkbox]){background:#fff}
/* header */
.app-h{background:linear-gradient(100deg,#0a1f4d,#12347a 60%,#1b4aa6);padding:14px 24px;gap:16px}
.logo{width:44px;height:44px;border-radius:50%;border-width:3px}
.ttl{display:flex;align-items:center;gap:14px}
.ttl h1{font-size:24px;letter-spacing:.04em}
.ttl small{display:block;font-size:12px;letter-spacing:.1em;opacity:.9;border-left:2px solid #ffffff55;padding-left:12px;margin-left:2px}
.nb{background:#ffffff1a;border:1px solid #ffffff40;border-radius:12px;padding:8px 16px;font-weight:600}
.nb.dark{background:#fff;color:var(--navy);border-color:var(--bd2)}
/* depot view: tabs become left sidebar on desktop */
.dbar{background:#fff;box-shadow:var(--sh);border:0;padding:10px 24px}
.dbar b{font-size:18px}
main{max-width:1700px;padding:16px 24px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:0 18px;align-items:start}
main>*{grid-column:2;min-width:0}
main>#tabs{grid-column:1;grid-row:1/span 30;position:sticky;top:12px;flex-direction:column;flex-wrap:nowrap;gap:4px;margin:8px 0;padding:10px;background:linear-gradient(180deg,#0a1f4d,#12347a);border-radius:var(--rad);box-shadow:var(--sh)}
#tabs button{background:transparent;color:#dbe6fb;border:0;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600}
#tabs button:hover{background:#ffffff1a}
#tabs button.on{background:var(--navy2);color:#fff}
/* toolbar + filters */
.bar{gap:8px}
#flt{background:#fff;border-radius:var(--rad);padding:10px 12px;box-shadow:var(--sh)}
#flt select,#flt input:not([type=checkbox]){min-width:150px;border-radius:99px;padding:6px 14px}
.info{font-weight:600;color:var(--navy)}
/* KPI cards */
.cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{border:0;border-radius:var(--rad);box-shadow:var(--sh);padding:14px 16px;border-left:4px solid var(--navy2)}
.card:hover{box-shadow:0 6px 18px #0f2a5f24}
.card small{font-weight:600}
.card b{font-size:28px;font-weight:700;color:var(--navy);line-height:1.2}
/* charts, tables, misc panels */
.cv{border:0;border-radius:var(--rad);box-shadow:var(--sh);padding:12px}
#view .grid{gap:14px}
.tw{border:0;border-radius:var(--rad);box-shadow:var(--sh)}
th{border-color:#1a3a7a;font-size:11px}
td,th{border-color:#e6ecf4}
.warn,details,.emptybox,fieldset{border-radius:var(--rad)}
h3{color:var(--navy)}
.mb{border-radius:var(--rad)}
.chip{border-radius:99px}
/* tablet / mobile: sidebar -> scrollable tab strip */
@media(max-width:1024px){
 main{display:block;padding:10px 12px}
 main>#tabs{position:static;flex-direction:row;overflow-x:auto;white-space:nowrap;margin:10px 0;background:#fff;box-shadow:var(--sh)}
 #tabs button{color:var(--navy);flex:0 0 auto}#tabs button:hover{background:#eef3fb}
 #tabs button.on{background:var(--navy2);color:#fff}
 .ttl{flex-direction:column;align-items:flex-start;gap:2px}.ttl small{border:0;padding:0;margin:0}
}
@media(max-width:700px){
 .app-h{padding:10px 12px}.ttl h1{font-size:18px}.ttl small{font-size:10px}
 .card b{font-size:22px}.cards{grid-template-columns:repeat(2,1fr)}
 #flt select,#flt input:not([type=checkbox]){min-width:0;flex:1 1 45%}
 .bar button,.bar .btn{flex:1 1 auto}
}
@media print{
 main{display:block}
 main>#tabs{display:none!important}
}
/* table alignment fix: clickable rows (tr.ck) must stay table rows; .ck flex is only for modal checkbox labels */
tr.ck{display:table-row;padding:0;gap:0;align-items:initial}
table{table-layout:auto;border-collapse:separate;border-spacing:0}
th,td{border:0;border-bottom:1px solid #e6ecf4;border-right:1px solid #eef2f8;padding:9px 12px}
th{border-right:1px solid #1f3f86;border-bottom:0;padding:11px 12px;z-index:1}
.tw{border-radius:var(--rad);overflow-x:auto}
td{border-radius:0;background:#fff}
tbody tr:nth-child(even) td{background:#f6f9fd}
tr.ck:hover td{background:#e8eef8}
td:first-child,th:first-child{position:sticky;left:0;z-index:2}
td:first-child{background:inherit;box-shadow:1px 0 0 #e6ecf4}
tbody tr td:first-child{background:#fff}
tbody tr:nth-child(even) td:first-child{background:#f6f9fd}
tr.ck:hover td:first-child{background:#e8eef8}
th:first-child{background:var(--hd)}
.pg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pg .np{display:inline-flex;align-items:center;gap:6px}
.pg button{min-height:28px;padding:2px 10px}
/* ===== SINGLE-SCREEN OVERVIEW LAYER (appended last; overrides earlier rules) ===== */
:root{--deep:#0b1f46;--blue:#2563EB;--green:#16A34A;--red:#DC2626;--amber:#F59E0B;--purple:#7C3AED;--cyan:#0891B2;--teal:#0D9488;--indigo:#4F46E5;--lblue:#EAF2FF;--bg:#e9eff8;--sbw:212px}
@media(min-width:1600px){:root{--sbw:236px}}
body{background:var(--bg)}
/* zoom button + modal helpers */
.cv{position:relative}
.zb{position:absolute;top:4px;right:5px;min-height:22px;width:22px;padding:0;font-size:12px;line-height:1;border-radius:7px;background:#fff;z-index:3;opacity:.7;display:grid;place-items:center}
.zb:hover{opacity:1}
.zwrap{position:relative;height:70vh;min-height:320px}
.zt{height:auto;max-height:75vh;overflow:auto}.zt th{pointer-events:none}.zt .pg{display:none}
/* ---- depot shell: sidebar (tabs) + content column ---- */
main{max-width:1900px;margin:0 auto;padding:10px 12px;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);gap:0 12px;align-items:start}
main>*{grid-column:2;min-width:0}
main>#tabs{grid-column:1;grid-row:1;margin:0;padding:8px;gap:3px;background:linear-gradient(180deg,#0b1f46,#102A56);border-radius:14px}
#tabs button{display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:13px;border-radius:10px;transition:background .15s,transform .15s}
#tabs button svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
#tabs button:hover{background:#ffffff1f}
#tabs button.on{background:linear-gradient(90deg,#2563EB,#1d4ed8);box-shadow:0 2px 8px #2563eb55}
.dcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.dbar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:3px 10px;background:#fff;border:0;border-radius:12px;box-shadow:var(--sh)}
.dbar b{font-size:14px;white-space:nowrap;color:var(--navy)}
.dbar .nb{min-height:28px;padding:3px 10px;font-size:12px;white-space:nowrap}
.dbar .info{margin:0 0 0 auto;min-width:0;font-size:11px;font-weight:500;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#actbar{display:flex;flex-wrap:wrap;gap:5px;margin:0}
#actbar button,#actbar .btn{display:inline-flex;align-items:center;min-height:28px;padding:2px 9px;font-size:11.5px;border-radius:8px;white-space:nowrap}
#warn:empty,#map:empty{display:none}
#warn .warn{margin:0 0 4px;padding:4px 8px;font-size:11.5px}
#map details{padding:2px 10px;border-radius:10px;font-size:11.5px}
#map summary{cursor:pointer;line-height:1.6;color:var(--m)}
#flt{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;margin:0;padding:6px 8px;background:#fff;border-radius:12px;box-shadow:var(--sh)}
#flt select,#flt input:not([type=checkbox]){min-width:0;min-height:30px;padding:2px 12px;font-size:12px;border-radius:99px;flex:0 1 auto}
#fd{width:172px}#fs{width:108px}#fc{width:142px}#fx{width:150px}
#flt #fq{flex:1 1 180px;width:auto}
#flt input[type=checkbox]{min-height:0;width:14px;height:14px;padding:0;margin:0;accent-color:var(--blue)}
#flt label{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--navy)}
/* ---- overview: base (non-fit) layout ---- */
.ovg{display:flex;flex-direction:column;gap:8px}
.ovg .cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.ovg .card{--ac:var(--blue);--tn:#EAF2FF;--tx:var(--ac);position:relative;min-width:0;padding:6px 9px 6px 10px;border:0;border-left:3px solid var(--ac);border-radius:10px;background:linear-gradient(135deg,#fff 0%,var(--tn) 100%);box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.ovg .card:hover{transform:translateY(-1px);box-shadow:0 5px 14px #0f2a5f26}
.ovg .card small{display:block;font-size:10px;font-weight:700;line-height:1.15;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovg .card b{display:block;margin-top:1px;font-size:clamp(15px,1.25vw,21px);line-height:1.15;color:var(--tx);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ovg .card i{display:block;min-height:11px;font-style:normal;font-size:9px;line-height:1.25;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.c-blue{--ac:#2563EB;--tn:#EAF2FF}
.card.c-cyan{--ac:#0891B2;--tn:#E0F7FB}
.card.c-indigo{--ac:#4F46E5;--tn:#EEF0FF}
.card.c-green{--ac:#16A34A;--tn:#DCFCE7}
.card.c-teal{--ac:#0D9488;--tn:#D5F5F0}
.card.c-red{--ac:#DC2626;--tn:#FEE2E2}
.card.c-purple{--ac:#7C3AED;--tn:#F1EAFF}
.card.c-amber{--ac:#F59E0B;--tx:#B45309;--tn:#FEF3C7}
.ovmid{display:grid;grid-template-columns:1fr;gap:8px;align-items:stretch}
.pn{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;padding:6px 8px;background:#fff;border-radius:12px;box-shadow:var(--sh)}
.pn h3{display:flex;align-items:center;gap:6px;margin:0 0 4px;padding-right:26px;font-size:12px;color:var(--navy)}
.pn h3::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--blue)}
.ovmid .tw{border:1px solid #e6ecf4;border-radius:8px;box-shadow:none;overflow-x:auto}
.ovmid table{width:100%;font-size:10.5px}
.ovmid th,.ovmid td{padding:2px 8px;line-height:1.25;white-space:nowrap}
.ovmid th{padding:4px 8px;font-size:9.5px;position:static}
.ovmid td.n{text-align:right;font-variant-numeric:tabular-nums}
.ovmid tbody td:nth-last-child(2):not(:first-child){background:#EAF2FF;font-weight:700;color:var(--navy)}
.ovmid td:last-child:not(:first-child){text-align:center}
.ovmid .pg{display:none}
.mgs{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:auto}
.pn .warn.plain{margin:0;padding:7px 9px;font-size:11.5px;line-height:1.5;border:1px solid #e6ecf4;border-radius:8px;background:#f8fafd}
.pn .warn.plain b{color:var(--navy)}.pn .warn.plain b.r{color:var(--red)}.pn .warn.plain b.a{color:#B45309}
.mpr{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.pbr{display:grid;grid-template-columns:1fr auto;gap:1px 6px;font-size:10.5px;color:#475569}

<script>
/* storage.js — in-memory only. Nothing is saved to the browser (no IndexedDB / localStorage / DB).
   All uploaded data lives in page memory and is cleared on refresh or close. */
'use strict';
const Store=(()=>{
 const KEY={depots:'id',reports:'key',meta:'k'};
 const mem={depots:new Map(),reports:new Map(),meta:new Map()};
 const all=async n=>[...mem[n].values()];
 const get=async(n,k)=>mem[n].get(k);
 const put=async(n,v)=>{mem[n].set(v[KEY[n]],v)};
 const del=async(n,k)=>{mem[n].delete(k)};
 return{
  init:async()=>{},
  depots:()=>all('depots'),
  saveDepot:d=>put('depots',d),
  reports:async id=>(await all('reports')).filter(r=>r.depotId===id),
  allReports:()=>all('reports'),
  report:k=>get('reports',k),
  saveReport:r=>put('reports',r),
  removeReport:k=>del('reports',k),
  getMeta:async k=>{const m=await get('meta',k);return m?m.v:undefined},
  setMeta:(k,v)=>put('meta',{k,v}),
  delMeta:k=>del('meta',k),
  reportKey:(depotId,date)=>depotId+'|'+date
 };
})();

<script>
/* dor-parser.js — Excel (SheetJS) parsing, column mapping, validation, row model and the central DOR calculation engine.
   The business logic (shift rules, trip pairing, loss, odometer, status) is the original DOR engine, parameterised per depot
   (home stop code / aliases) instead of being hard-wired. */
'use strict';
/* ============ SHARED HELPERS ============ */
const $=s=>document.querySelector(s),
 esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
 n0=v=>(+v||0).toLocaleString('en-IN',{maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n};
const tm=v=>{if(v===''||v==null)return null;if(typeof v==='number')return Math.round((v%1)*1440)%1440;const m=String(v).match(/(\d{1,2}):(\d{2})/);return m?(+m[1]*60+ +m[2])%1440:null};
const hm=t=>t==null?'':String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0),uniq=(l,f)=>[...new Set(l.map(f).filter(Boolean))].join(', '),by=(rs,f)=>{const o={};rs.forEach(r=>(o[f(r)]??=[]).push(r));return o};
const lk=r=>r.loss!=null?r.loss:Math.max(0,(r.sKm||0)-(r.aKm||0));
const ISO=/^\d{4}-\d{2}-\d{2}$/;
const dmy=iso=>ISO.test(iso||'')?iso.slice(8)+'-'+iso.slice(5,7)+'-'+iso.slice(0,4):(iso||'');
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'depot';
/* strict date -> 'YYYY-MM-DD', or '' when blank / not a real calendar date */
function normDate(v){
 if(v===''||v==null)return'';
 if(typeof v==='number'){if(v<20000||v>80000)return'';return new Date(Math.floor(v-25569)*864e5).toISOString().slice(0,10)}
 const s=String(v).trim();let y,m,d,x;
 if(x=s.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/)){y=+x[1];m=+x[2];d=+x[3]}
 else if(x=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/)){d=+x[1];m=+x[2];y=+x[3]}
 else return'';
 const t=new Date(Date.UTC(y,m-1,d));
 if(t.getUTCFullYear()!==y||t.getUTCMonth()!==m-1||t.getUTCDate()!==d)return'';
 return `${y}-${pad(m)}-${pad(d)}`;
}
function readFile(f){return new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=()=>no(rd.error||new Error('Could not read the file'));rd.readAsArrayBuffer(f)})}

/* ============ CONFIG ============ */
const JBS=/\bJBS\b|JUBILEE/i;
const DEST_BASE={jbs:'JBS',gdk:'GDK',mncl:'MNCL',mnty:'MNTY',kmr:'KMR',jgtl:'JGTL',metpelly:'Metpelly',hnk:'HNK',nizamabad:'NZB',nzb:'NZB',warangal:'WGL',wgl:'WGL',luxettipet:'Luxettipet'};
const F={date:/^(date|reportdate|dutydate|dordate)$/,depot:/^depot(name)?$/,svc:/^(routeno|serviceno|service|routenumber)$/,routes:/^(routes?|routename|routedescription)$/,bus:/^(busno|busnumber|vehicleno)$/,trip:/^(trip|tripno)$/,sT:/^schedulestart/,aT:/^actualstart/,sKm:/^(schedulekms?|schkm)$/,aKm:/^(actroutekms?|actualroutekms?)$/,loss:/^routekmloss$/,odo:/^odometerdiff/,miss:/^misstrip/,reason:/^reasonforkilometerloss/,bin:/^bining/,log:/^logsheetremarks/,rem:/^remarks?$/,drv:/^(driverid|driverno|driver)$/,cat:/^(buscategory|category|servicetype|servicecategory)$/,model:/^(busmodel|model|bustype)$/,soc:/^soc/};
const LBL={date:'Date',depot:'Depot Name',svc:'Route No. (service)*',routes:'Routes',bus:'Bus No.*',trip:'Trip',sT:'Schedule Start Time',aT:'Actual Start Time',sKm:'Schedule Km*',aKm:'Act. Route Km*',loss:'Route Km Loss',odo:'Odometer Diff. Km (B-A)',miss:'Miss Trip',reason:'Reason For Km Loss',bin:'Bining For Reson KM Loss',log:'Logsheet Remarks',rem:'Remarks',drv:'Driver ID',cat:'Bus Category',model:'Bus Model',soc:'SOC consumption'};
const REQ=['svc','bus','sKm','aKm'],OPT_WARN=['depot','sT','drv','odo','date'];

const Engine=(()=>{
 const defaultConfig=()=>({tol:5,abn:50,home:'KNR',homeAliases:'karimnagar,knr,krmr',destAliases:''});
 /* ctx = per-depot interpretation of the "Depot Name" column (where each leg starts) */
 function makeCtx(cfg){
  cfg=Object.assign(defaultConfig(),cfg||{});
  const home=String(cfg.home||'KNR').trim().toUpperCase()||'KNR';
  const clean=s=>String(s).toLowerCase().replace(/[^a-z]/g,'');
  const al=new Set(String(cfg.homeAliases||'').split(',').map(clean).filter(Boolean));al.add(clean(home));
  const extra={};String(cfg.destAliases||'').split(',').forEach(p=>{const [a,b]=p.split('=');if(a&&b&&clean(a))extra[clean(a)]=b.trim().toUpperCase()});
  return{home,org:d=>{const k=clean(d);return al.has(k)?home:(extra[k]||DEST_BASE[k]||String(d).trim().toUpperCase())}};
 }
 /* ---- Excel workbook -> header / column map / data rows (every non-empty row kept with its true Excel row number) ---- */
 function detectMap(hdr){const m={};for(const k in F)m[k]=hdr.findIndex(x=>F[k].test(norm(x)));return m}
 function parseWorkbook(buf,name){
  let wb;
  try{wb=XLSX.read(buf,{type:'array'})}catch(e){throw new Error('This file is not a readable Excel workbook ('+e.message+')')}
  if(!wb.SheetNames.length)throw new Error('The workbook contains no worksheets.');
  const sn=wb.SheetNames.find(n=>/^dor$/i.test(n.trim()))||wb.SheetNames.find(n=>/dor/i.test(n)),sheet=sn||wb.SheetNames[0],ws=wb.Sheets[sheet];
  if(!ws||!ws['!ref'])throw new Error(`Worksheet "${sheet}" is empty.`);
  const rg=XLSX.utils.decode_range(ws['!ref']),a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  for(const addr in ws){if(addr[0]==='!')continue;const c=ws[addr];if(c&&c.t==='e'){const p=XLSX.utils.decode_cell(addr),row=a[p.r-rg.s.r];if(row)row[p.c-rg.s.c]=c.w||'#ERROR!'}}   // formula errors stay visible as text
  if(!a.length)throw new Error(`Worksheet "${sheet}" has no data.`);
  let best=-1,h=0;for(let i=0;i<Math.min(25,a.length);i++){const c=a[i].filter(x=>x!==''&&Object.values(F).some(re=>re.test(norm(x)))).length;if(c>best){best=c;h=i}}
  const hdr=(a[h]||[]).map(x=>String(x).trim()),map=detectMap(hdr),items=[];let emptyRows=0;
  for(let i=h+1;i<a.length;i++){const row=a[i];if(row.every(c=>c===''))emptyRows++;else items.push({row,rn:rg.s.r+1+i})}
  return{file:name,sheet,noSheet:!sn,h,hdr,map,items,emptyRows,headerHits:best};
 }
 /* One workbook may hold several days: split into one group per reporting date. Rows with a blank/invalid date follow the main date. */
 function splitByDate(p,sel){
  const m=p.map,g={},und=[];
  p.items.forEach(it=>{const d=m.date>=0?normDate(it.row[m.date]):'';if(d)(g[d]??=[]).push(it);else und.push(it)});
  const ds=Object.keys(g).sort();
  if(!ds.length){
   if(!ISO.test(sel||''))throw new Error('This workbook has no usable Date column, so the reporting date must be entered.');
   return[{date:sel,items:p.items}];
  }
  const main=(sel&&g[sel])?sel:ds.reduce((x,y)=>g[y].length>g[x].length?y:x);
  und.forEach(it=>g[main].push(it));g[main].sort((x,y)=>x.rn-y.rn);
  return ds.map(d=>({date:d,items:g[d]}));
 }
 /* ---- ROW MODEL: classification, shift, direction, destination, validation flags ---- */
 function buildRows(rep,ctx){
  const m=rep.map,seen=new Set(),s=x=>String(x??'').trim(),rows=[],skipped=[],H=ctx.home;
  rep.data.forEach((a,i)=>{
   const g=k=>m[k]>=0?a[m[k]]:'',rawDate=g('date'),nd=normDate(rawDate);
   const r={i:rep.rn?rep.rn[i]:rep.h+i+2,date:nd||rep.date,depot:s(g('depot')),svc:s(g('svc')).toUpperCase(),routes:s(g('routes')),bus:s(g('bus')).toUpperCase(),sT:tm(g('sT')),aT:tm(g('aT')),sKm:num(g('sKm')),aKm:num(g('aKm')),loss:num(g('loss')),odo:num(g('odo')),miss:num(g('miss')),drv:s(g('drv')),model:s(g('model')),soc:num(g('soc')),reason:['reason','bin','log','rem'].map(k=>s(g(k))).find(x=>x)||'',is:[]};
   if(!r.svc&&!r.bus){skipped.push(r.i);return}               // blank / total rows: excluded but listed in Data Quality
   if(rawDate!==''&&rawDate!=null&&!nd)r.is.push('Invalid date ('+s(rawDate)+')');
   r.org=ctx.org(r.depot);const jb=JBS.test(r.routes+' '+r.depot),cr=s(g('cat'))+' '+r.model;
   let b=/super\s*lux|slx|\bsl\b/i.test(cr)?'Super Luxury':/express|\bexp\b/i.test(cr)?'Express':/deluxe|dlx/i.test(cr)?'Deluxe':'';
   if(!b&&jb){b=/^(SL|SJ)/.test(r.svc)?'Super Luxury':'Express';r.is.push('Category inferred from service no.')}
   r.cat=jb&&(b==='Express'||b==='Super Luxury')?'JBS '+b:(b||'Other');r.jb=r.cat.startsWith('JBS');
   if(r.jb){const n=(r.svc.match(/(\d+)$/)||[])[1];r.shift=n==null?'Unknown':n%2?'First':'Second';if(n==null)r.is.push('JBS service no. has no number')}   // special rule: odd=First, even=Second
   r.op=(r.aKm||0)>0;
   if(!r.bus)r.is.push('Missing bus no.');if(!r.svc)r.is.push('Missing route/service no.');if(!r.depot)r.is.push('Missing depot name');
   if(r.op&&!r.drv)r.is.push('Missing driver ID');if(r.sT==null)r.is.push('Missing scheduled time');if(r.op&&r.aT==null)r.is.push('Missing actual time');
   if(r.op&&r.odo==null)r.is.push('Missing odometer');if(r.op&&r.odo===0)r.is.push('Zero odometer on operated leg');if(r.aKm<0||r.odo<0)r.is.push('Negative km');if(r.sKm==null)r.is.push('Missing schedule km');
   if(g('aKm')!==''&&r.aKm==null)r.is.push('Non-numeric actual km');
   if(g('sKm')!==''&&r.sKm==null)r.is.push('Non-numeric schedule km');
   if(g('odo')!==''&&r.odo==null)r.is.push('Non-numeric odometer');
   if(a.some(c=>/^#(REF|N\/A|VALUE|DIV|NAME|NUM|NULL)/.test(String(c))))r.is.push('Formula error in row');
   const cl=Math.max(0,(r.sKm||0)-(r.aKm||0));if(r.loss!=null&&Math.abs(r.loss-cl)>0.5)r.is.push(`Loss km mismatch (reported ${r.loss}, calc ${cl.toFixed(1)})`);
   const dk=JSON.stringify([r.date,r.svc,r.bus,g('trip'),r.sT,r.aT,r.sKm,r.aKm,r.depot]);if(seen.has(dk)){r.dup=true;r.is.push('Duplicate record')}seen.add(dk);
   rows.push(r)});
  /* TRIP PAIRING: legs of one date+service+bus, in DOR order. Two consecutive legs starting at DIFFERENT stops = one round trip
     (e.g. home→GDK + GDK→home, or NZB→WGL + WGL→NZB). A leg with no partner is flagged, never counted as a trip. */

const fileBase=()=>`${slug(S.depot.name)}_${S.f.date||'All-Dates'}`;
const KPI_HEAD=['Total Fleet','Buses on Road','Scheduled Services','Operated Services','Scheduled Trips','Operated Trips','Loss Trips','Scheduled KMs','Operated KMs','Loss KMs','Odometer KMs','Actual − Odo Diff'];
const kpiRow=s=>[s.fleet,s.onRoad,s.schServices,s.opServices,s.schTrips,s.opTrips,s.lossTrips,s.schKm,s.opKm,s.lossKm,s.odoKm,s.diff];
const needData=()=>{if(!S.rows.length){toast('No report data loaded for this depot/date.','warn');return true}return false};
const addSheet=(wb,n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n.slice(0,31));

/* Depot-wise Excel report (selected depot + selected date or all dates) — the original multi-sheet export */
function xl(){if(needData())return;const rs=rows(),k=K(rs),wb=XLSX.utils.book_new();
 addSheet(wb,'Summary',[['Depot',S.depot.name],['Report date',S.f.date?dmy(S.f.date):'All dates'],['Files',[...new Set(S.reports.filter(r=>!S.f.date||r.date===S.f.date).map(r=>r.fileName))].join(', ')],['Scheduled services',k.svcS],['Operated services',k.svcO],['Buses on road',k.buses],['Scheduled trips',k.schT],['Operated trips',k.opT],['Loss trips',k.lossT],['Scheduled KMs',k.sKm],['Operated KMs',k.oKm],['Loss KMs',k.lossKm],['Odo KMs',k.odo],['Actual − Odo',k.diff]]);
 const sh=['First','Second','Unknown'].map(s=>[s,K(rows(1).filter(r=>r.shift===s))]);
 addSheet(wb,'Shifts',[['Shift','Sched services','Op services','Sched trips','Op trips','Loss trips','Sched KMs','Op KMs','Loss KMs','Odo KMs','Buses'],...sh.map(([s,x])=>[s,x.svcS,x.svcO,x.schT,x.opT,x.lossT,x.sKm,x.oKm,x.lossKm,x.odo,x.buses])]);
 [['Destinations','dest'],['Services','svc'],['Buses','bus'],['Drivers','drv']].forEach(([n,f])=>{const d=DS[f](rs);addSheet(wb,n,aoa(d.cols,d.data))});
 addSheet(wb,'Exceptions',aoa(RC,rs.filter(r=>r.is.length)));
 XLSX.writeFile(wb,`DOR_Report_${fileBase()}.xlsx`)}

/* Date-wise Excel report: one row per reporting date for this depot (all filters except date apply) */
function xlDates(){if(needData())return;const rs=rows(0,1),ds=[...new Set(rs.map(r=>r.date))].sort(),wb=XLSX.utils.book_new();
 const fl=S.fleet?S.fleet.size:0,head=['Date','File',...KPI_HEAD,'Status'];
 const lines=ds.map(d=>{const x=rs.filter(r=>r.date===d),s=Engine.summaryOf(x,fl),rep=S.reports.find(r=>r.date===d);return[dmy(d),rep?rep.fileName:'',...kpiRow(s),s.lossTrips?'Partially Operated':'Fully Operated']});
 addSheet(wb,'Date-wise',[[`${S.depot.name} – date-wise DOR summary`],head,...lines]);
 const tot=Engine.summaryOf(rs,fl);addSheet(wb,'All dates total',[['Depot',S.depot.name],['Dates covered',ds.map(dmy).join(', ')],...KPI_HEAD.map((h,i)=>[h,kpiRow(tot)[i]])]);
 XLSX.writeFile(wb,`DOR_DateWise_${slug(S.depot.name)}.xlsx`)}

/* Destination-, bus-, driver-wise and data quality reports */
function xlSet(kind){if(needData())return;const rs=rows(),wb=XLSX.utils.book_new(),names={dest:'Destination-wise',bus:'Bus-wise',drv:'Driver-wise',svc:'Service-wise'};
 if(kind==='dq'){const {all,bad,A,sh,t,sd,sb,K0}=dqStats();
  addSheet(wb,'Summary',[['Depot',S.depot.name],['Report date',S.f.date?dmy(S.f.date):'All dates'],['Records processed',all.length],['Valid (no issue)',all.length-bad.length],['Duplicates (kept, flagged)',all.filter(r=>r.dup).length],['Need verification',bad.length],['Unrecognized routes',all.filter(r=>r.dest==='Unknown').length],['Unmatched legs',all.filter(r=>r.is.some(x=>/Unmatched/.test(x))).length],['Excluded blank/total rows',S.skipped.length],['Excluded row numbers',S.skipped.join(', ')]]);
  addSheet(wb,'Reconciliation',[['Check','Result'],['First + Second (+Unknown) operated KMs = daily total',t(sh('First').oKm+sh('Second').oKm+sh('Unknown').oKm,A.oKm)],['Shift operated trips = daily total',t(sh('First').opT+sh('Second').opT+sh('Unknown').opT,A.opT)],['Destination-wise operated KMs = total',t(sd,K0.oKm)],['Bus-wise operated KMs = total',t(sb,K0.oKm)],['Reported loss km vs (Scheduled − Actual)',t(K0.lossKm,K0.calcLoss)+` (${n0(K0.lossKm)} vs ${n0(K0.calcLoss)})`]]);
  const issueRows=[];S.reports.filter(r=>!S.f.date||r.date===S.f.date).forEach(rep=>{const v=rep.validation;if(v)issueRows.push([dmy(rep.date),rep.fileName,v.records,v.excluded,v.emptyRows,v.missingBus,v.missingSvc,v.missingDepot,v.missingDriver,v.invalidDate,v.formulaErr,v.kmIssues,v.duplicates,v.flagged])});
  addSheet(wb,'Upload validation',[['Date','File','Records','Excluded rows','Empty rows','Missing bus','Missing service','Missing depot','Missing driver','Invalid date','Formula errors','Km issues','Duplicates','Records flagged'],...issueRows]);
  addSheet(wb,'Exceptions',aoa([['Date',r=>dmy(r.date)],...RC],bad));
  XLSX.writeFile(wb,`DOR_DataQuality_${fileBase()}.xlsx`);return}
 const d=DS[kind](rs);addSheet(wb,names[kind],[[`${S.depot.name} – ${names[kind]} report – ${S.f.date?dmy(S.f.date):'All dates'}`],...aoa(d.cols,d.data)]);
 XLSX.writeFile(wb,`DOR_${names[kind]}_${fileBase()}.xlsx`)}

/* ============ CONSOLIDATED MULTI-DEPOT REPORT (only the chosen depots and dates; depots never merged into each other) ============ */
async function consData(depIds,dates){
 const out=[],missing=[];
 for(const id of depIds){
  const d=APP.depots.find(x=>x.id===id);if(!d)continue;
  const ctx=Engine.makeCtx(d.config),fl=(APP.fleet[id]||[]).length||0;
  const reps=(APP.reports[id]||[]).filter(r=>dates.includes(r.date)&&r.status==='Processed').sort((a,b)=>a.date<b.date?-1:1);
  dates.forEach(dt=>{if(!reps.some(r=>r.date===dt))missing.push([d.name,dt])});
  if(!reps.length)continue;
  const all=[],per=[];
  reps.forEach(rep=>{const b=Engine.buildRows(rep,ctx);b.rows.forEach(r=>all.push(r));per.push({date:rep.date,file:rep.fileName,sum:Engine.summaryOf(b.rows,fl)})});
  out.push({depot:d,per,rows:all,total:Engine.summaryOf(all,fl)});
 }
 return{out,missing};
}
function consSheets(c,dates){
 const head=['Depot','Date','File',...KPI_HEAD],lines=[];
 c.out.forEach(o=>o.per.forEach(p=>lines.push([o.depot.name,dmy(p.date),p.file,...kpiRow(p.sum)])));
 const tot=[],net=new Array(12).fill(0);
 c.out.forEach(o=>{const r=kpiRow(o.total);tot.push([o.depot.name,o.per.length+' date(s)',...r]);r.forEach((v,i)=>net[i]+=v)});
 tot.push(['NETWORK TOTAL (selected depots)','',...net]);
 return{head,lines,totHead:['Depot','Dates included',...KPI_HEAD],tot};
}
async function consolidatedExcel(depIds,dates){
 const c=await consData(depIds,dates);if(!c.out.length){toast('No reports match the selected depots and dates.','warn');return}
 const s=consSheets(c,dates),wb=XLSX.utils.book_new();
 addSheet(wb,'Consolidated',[['CHAKRA E-TRANS – Consolidated DOR report'],s.head,...s.lines]);
 addSheet(wb,'Depot totals',[['Totals per depot over the selected dates (services/buses counted once per depot)'],s.totHead,...s.tot]);
 addSheet(wb,'Selection',[['Depots',c.out.map(o=>o.depot.name).join(', ')],['Dates',dates.slice().sort().map(dmy).join(', ')],['Missing (depot – date)',c.missing.map(m=>m[0]+' – '+dmy(m[1])).join('; ')||'none'],['Generated',new Date().toLocaleString('en-IN')]]);
 const ex=[];c.out.forEach(o=>o.rows.filter(r=>r.is.length).forEach(r=>ex.push([o.depot.name,dmy(r.date),...RC.map(x=>x[1](r))])));
 addSheet(wb,'Exceptions',[['Depot','Date',...RC.map(x=>x[0])],...ex]);
 XLSX.writeFile(wb,`CHAKRA_Consolidated_DOR_${new Date().toISOString().slice(0,10)}.xlsx`);
 toast(`Consolidated Excel generated: ${c.out.length} depot(s), ${s.lines.length} report(s).`,'ok');
}
async function consolidatedPdf(depIds,dates){
 const c=await consData(depIds,dates);if(!c.out.length){toast('No reports match the selected depots and dates.','warn');return}
 const s=consSheets(c,dates),cell=v=>typeof v==='number'?`<td class=n>${n0(v)}</td>`:`<td>${esc(v)}</td>`;
 const tb=(h,r)=>`<table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.map(l=>`<tr>${l.map(cell).join('')}</tr>`).join('')}</tbody></table>`;
 $('#printArea').innerHTML=`<h1>CHAKRA E-TRANS – Consolidated DOR Report</h1><p>Depots: ${esc(c.out.map(o=>o.depot.name).join(', '))} · Dates: ${esc(dates.slice().sort().map(dmy).join(', '))} · Generated ${esc(new Date().toLocaleString('en-IN'))}</p><h2>Depot totals</h2>${tb(s.totHead,s.tot)}<h2>Depot-wise, date-wise</h2>${tb(s.head,s.lines)}${c.missing.length?`<p class=note>No report for: ${esc(c.missing.map(m=>m[0]+' – '+dmy(m[1])).join('; '))}</p>`:''}`;
 document.body.classList.add('print-cons');
 const done=()=>{document.body.classList.remove('print-cons');$('#printArea').innerHTML='';window.removeEventListener('afterprint',done)};
 window.addEventListener('afterprint',done);setTimeout(()=>{print();setTimeout(done,1500)},150);
}

</script>
<script>
/* app.js — CHAKRA E-TRANS: depot registry + DOR reports by depot and date, upload flow (button in the dashboard action bar),
   depot selector, history, settings, consolidated report. All uploaded data is kept in memory only (storage.js). */
'use strict';
const APP={depots:[],reports:{},sel:{},fleet:{},cache:{},cur:null};   // reports[depotId] = [report…], sel[depotId] = 'YYYY-MM-DD' | 'ALL', fleet[depotId] = [bus…]
const depot=id=>APP.depots.find(d=>d.id===id);
const tick=()=>new Promise(r=>setTimeout(r,30));
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const stamp=ts=>ts?new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
let EXPECT=null;                                              // date expected by "Replace" in History (null for a normal upload)

/* ---------- small UI helpers ---------- */
function toast(msg,type='ok',ms=5000){const el=document.createElement('div');el.className='toast '+type;el.setAttribute('role','status');el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),ms)}
function busy(on,msg){$('#busy').style.display=on?'flex':'none';if(msg)$('#busyMsg').textContent=msg}
function amodal(html){$('#ab').innerHTML=html;$('#am').style.display='flex'}
function closeAm(){$('#am').style.display='none';$('#ab').innerHTML=''}

/* ---------- state helpers ---------- */
function saveSel(){}
function bump(id){Object.keys(APP.cache).forEach(k=>{if(k.startsWith(id+'|'))delete APP.cache[k]})}
function setReport(rep){const l=APP.reports[rep.depotId]=(APP.reports[rep.depotId]||[]).filter(r=>r.key!==rep.key);l.push(rep);l.sort((a,b)=>a.date<b.date?-1:1);bump(rep.depotId)}
const fleetSizeOf=id=>(APP.fleet[id]||[]).length||0;
function defaultSel(id){const l=APP.reports[id]||[];return l.length?l[l.length-1].date:todayISO()}
async function recomputeDepot(id){
 const d=depot(id),ctx=Engine.makeCtx(d.config),fl=fleetSizeOf(id);
 for(const rep of APP.reports[id]||[]){rep.depotName=d.name;Engine.evaluate(rep,ctx,fl);await Store.saveReport(rep)}
 bump(id);
}

/* ---------- UPLOAD FLOW ---------- */
function pickUpload(expect){EXPECT=(typeof expect==='string'&&expect)?expect:null;const f=$('#dorFile');f.value='';f.click()}
async function handleUpload(id,file,expect){
 const d=depot(id);if(!d||!file)return;
 if(!/\.(xlsx|xls)$/i.test(file.name)){toast(`"${file.name}" is not supported. Please upload an .xlsx or .xls DOR workbook.`,'err');return}
 busy(true,`Reading ${file.name}…`);
 try{
  await tick();const buf=await readFile(file);
  busy(true,'Detecting worksheet, headers and dates…');await tick();
  const p=Engine.parseWorkbook(buf,file.name);let sel=expect||APP.sel[id],groups;
  try{groups=Engine.splitByDate(p,sel)}
  catch(err){
   if(!/no usable Date/.test(err.message))throw err;
   busy(false);
   const a=prompt(`${file.name} has no usable Date column.\n\nEnter the reporting date for this DOR (DD-MM-YYYY):`,dmy(ISO.test(sel||'')?sel:todayISO())),nd=a?normDate(a.trim()):'';
   if(!nd){toast('Upload cancelled — no valid reporting date was entered.','warn');return}
   sel=nd;busy(true,'Processing DOR…');await tick();groups=Engine.splitByDate(p,nd);
  }
  const have=APP.reports[id]||[],repl=groups.filter(g=>have.some(r=>r.date===g.date)),msg=[];
  if(groups.length>1)msg.push(`${file.name} contains ${groups.length} reporting dates (${dmy(groups[0].date)} → ${dmy(groups[groups.length-1].date)}). Each date will be stored as a separate report for ${d.name}.`);
  else if(expect&&groups[0].date!==expect)msg.push(`The Date column in ${file.name} is ${dmy(groups[0].date)}, but you chose to replace ${dmy(expect)}. The report will be stored under ${dmy(groups[0].date)}.`);
  if(repl.length)msg.push(`This replaces the existing ${d.name} report${repl.length>1?'s':''} for: ${repl.map(g=>dmy(g.date)).join(', ')}.`);
  if(msg.length){busy(false);if(!confirm(msg.join('\n\n')+'\n\nContinue?')){toast('Upload cancelled — nothing was changed.','warn');return}busy(true,'Processing DOR…');await tick()}
  const made=[];
  for(const [i,g] of groups.entries()){
   busy(true,`Calculating ${dmy(g.date)} (${i+1}/${groups.length})…`);await tick();
   const rep=Engine.makeReport(d,g.date,p,g.items,file.name,fleetSizeOf(id),i===0?p.emptyRows:0);
   await Store.saveReport(rep);setReport(rep);made.push(rep);
  }
  APP.sel[id]=groups.length===1?groups[0].date:(groups.some(g=>g.date===sel)?sel:groups[groups.length-1].date);saveSel();
  showDepot(id);
  const bad=made.filter(r=>r.status!=='Processed'),flagged=made.reduce((a,r)=>a+(r.validation?r.validation.flagged:0),0);
  if(bad.length)toast(`${file.name} stored, but required columns are missing — map them under "Column mapping" below.`,'warn',8000);
  else toast(`${d.name}: ${made.length} report${made.length>1?'s':''} processed from ${file.name}${flagged?` — ${flagged} record${flagged>1?'s':''} flagged for verification`:''}.`,flagged?'warn':'ok',6000);
  if(bad.length||flagged||p.emptyRows||made.some(r=>r.validation&&r.validation.excluded))uploadSummary(d,made,p);
 }catch(e){toast('Upload failed: '+e.message,'err',9000)}
 finally{busy(false)}
}
function uploadSummary(d,reps,p){
 const th=['Date','Status','Records','Excluded rows','Empty rows','Missing bus','Missing service','Missing depot','Missing driver','Invalid date','Formula errors','Km issues','Duplicates','Flagged'];
 const tr=reps.map(r=>{const v=r.validation;return v?[dmy(r.date),r.status,v.records,v.excluded,v.emptyRows,v.missingBus,v.missingSvc,v.missingDepot,v.missingDriver,v.invalidDate,v.formulaErr,v.kmIssues,v.duplicates,v.flagged]:[dmy(r.date),r.status+' – missing: '+(r.missing||[]).map(k=>LBL[k]).join(', '),'','','','','','','','','','','','']});
 const notes=[];
 if(p.noSheet)notes.push(`No worksheet named "Dor" was found; "${esc(p.sheet)}" was used.`);
 notes.push('Nothing is discarded: flagged rows stay in the dashboard and are listed under Data Quality. Empty rows and blank/total rows (no service and no bus number) are excluded from calculations.');
 amodal(`<h3>Upload summary – ${esc(d.name)}</h3><p class="mut">${esc(p.file)} · sheet ${esc(p.sheet)}</p><div class="tw"><table><thead><tr>${th.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${tr.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${notes.map(n=>`<p class="mut">${n}</p>`).join('')}<p class="mact"><button class="pri" data-act="close">OK</button></p>`);
}
async function removeReport(id,date){
 const d=depot(id),rep=(APP.reports[id]||[]).find(r=>r.date===date);if(!rep)return;
 if(!confirm(`Remove the ${d.name} DOR report for ${dmy(date)} (${rep.fileName})?\n\nThis cannot be undone. Other dates and other depots are not affected.`))return;
 try{await Store.removeReport(rep.key);APP.reports[id]=APP.reports[id].filter(r=>r.key!==rep.key);bump(id);APP.sel[id]=defaultSel(id);saveSel();showDepot(id);toast(`${d.name}: report for ${dmy(date)} removed.`,'ok')}
 catch(e){toast('Could not remove report: '+e.message,'err')}
}
/* ---------- HISTORY ---------- */
function historyModal(id){
 const d=depot(id),rs=APP.reports[id]||[],byDate=Object.fromEntries(rs.map(r=>[r.date,r]));let list=rs.map(r=>r.date);
 if(!rs.length){amodal(`<h3>Report history – ${esc(d.name)}</h3><p class="mut">No DOR has been uploaded for this depot yet.</p><p class="mact"><button class="pri" data-act="close">Close</button></p>`);return}
 {const a=new Date(rs[0].date+'T00:00:00Z'),b=new Date(rs[rs.length-1].date+'T00:00:00Z'),n=Math.round((b-a)/864e5)+1;
  if(n<=400){list=[];for(let i=0;i<n;i++)list.push(new Date(a.getTime()+i*864e5).toISOString().slice(0,10))}}
 list.sort().reverse();
 const rowsH=list.map(dt=>{const r=byDate[dt];return r?`<tr><td>${dmy(dt)}</td><td class="s-ok">DOR Uploaded${r.status!=='Processed'?' <span class="s-w">(mapping required)</span>':''}</td><td>${esc(r.fileName)}</td><td>${stamp(r.uploadTimestamp)}</td><td>${r.validation?n0(r.validation.records):'—'}</td><td class="acts"><button data-act="hview" data-date="${dt}" data-id="${esc(id)}">View</button> <button data-act="hrepl" data-date="${dt}" data-id="${esc(id)}">Replace</button> <button class="danger" data-act="hdel" data-date="${dt}" data-id="${esc(id)}">Remove</button></td></tr>`:`<tr><td>${dmy(dt)}</td><td class="mut">No Report</td><td>—</td><td>—</td><td>—</td><td class="acts"><button data-act="hrepl" data-date="${dt}" data-id="${esc(id)}">Upload</button></td></tr>`}).join('');
 amodal(`<h3>Report history – ${esc(d.name)}</h3><div class="tw"><table><thead><tr><th>Date</th><th>Status</th><th>File</th><th>Uploaded</th><th>Records</th><th>Actions</th></tr></thead><tbody>${rowsH}</tbody></table></div><p class="mact"><button class="pri" data-act="close">Close</button></p>`);
}
/* ---------- DEPOT SETTINGS / ADD DEPOT ---------- */
function settingsModal(id){
 const d=depot(id),c=d.config;
 amodal(`<h3>Depot settings – ${esc(d.name)}</h3><div class="form">
 <label>Depot name<input id="s_name" value="${esc(d.name)}"></label>
 <label>Home stop code<input id="s_home" value="${esc(c.home)}"><small>Legs starting here are “outward”; used for trip pairing (default KNR).</small></label>
 <label>Home stop spellings (comma separated)<input id="s_alias" value="${esc(c.homeAliases)}"><small>Spellings in the “Depot Name” column that mean the home stop.</small></label>
 <label>Extra destination aliases<input id="s_dest" value="${esc(c.destAliases)}" placeholder="e.g. peddapalli=PDPL, sircilla=SRC"></label>
 <label>Odometer tolerance (km)<input id="s_tol" type="number" value="${c.tol}"></label>
 <label>Abnormal odometer difference above (km)<input id="s_abn" type="number" value="${c.abn}"></label></div>
 <p class="mact"><button class="pri" data-act="savesettings" data-id="${esc(id)}">Save &amp; recalculate</button><button data-act="close">Cancel</button></p>`);
}
async function saveSettings(id){
 const d=depot(id),name=$('#s_name').value.trim();if(!name){toast('Depot name cannot be empty.','err');return}
 if(APP.depots.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){toast('Another depot already uses that name.','err');return}
 d.name=name;d.config={home:($('#s_home').value.trim()||'KNR').toUpperCase(),homeAliases:$('#s_alias').value.trim(),destAliases:$('#s_dest').value.trim(),tol:+$('#s_tol').value||0,abn:+$('#s_abn').value||0};
 busy(true,'Recalculating reports…');
 try{await tick();await Store.saveDepot(d);await recomputeDepot(id);closeAm();showDepot(id);toast(`${d.name}: settings saved and reports recalculated.`,'ok')}
 catch(e){toast('Could not save settings: '+e.message,'err')}finally{busy(false)}
}
function addDepotModal(){amodal(`<h3>Add depot</h3><div class="form"><label>Depot name<input id="n_name" placeholder="e.g. Depot 4"></label></div><p class="mact"><button class="pri" data-act="adddepot">Add</button><button data-act="close">Cancel</button></p>`);setTimeout(()=>{const i=$('#n_name');i&&i.focus()},30)}
async function addDepot(){
 const name=($('#n_name').value||'').trim();if(!name){toast('Enter a depot name.','err');return}
 if(APP.depots.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('A depot with that name already exists.','err');return}
 let id=slug(name),n=2;while(depot(id))id=slug(name)+'-'+n++;
 const d={id,name,order:APP.depots.length+1,config:Engine.defaultConfig()};
 await Store.saveDepot(d);APP.depots.push(d);APP.reports[id]=[];APP.sel[id]=todayISO();saveSel();closeAm();toast(`${name} added.`,'ok');
 location.hash='#/depot/'+encodeURIComponent(id);
}
/* ---------- CONSOLIDATED REPORT MODAL ---------- */
let CONS={deps:new Set(),dates:new Set(),init:false};
function consolidatedModal(){
 const deps=APP.depots.filter(d=>(APP.reports[d.id]||[]).some(r=>r.status==='Processed'));
 if(!deps.length){toast('Upload at least one DOR report first.','warn');return}
 CONS={deps:new Set(deps.map(d=>d.id)),dates:null};renderCons();
}
function consDates(){const s=new Set();CONS.deps.forEach(id=>(APP.reports[id]||[]).forEach(r=>{if(r.status==='Processed')s.add(r.date)}));return[...s].sort().reverse()}
function renderCons(){
 const dates=consDates();if(CONS.dates===null)CONS.dates=new Set(dates);else CONS.dates=new Set([...CONS.dates].filter(x=>dates.includes(x)));
 const sel=[...CONS.dates];let pairs=0;CONS.deps.forEach(id=>sel.forEach(dt=>{if((APP.reports[id]||[]).some(r=>r.date===dt&&r.status==='Processed'))pairs++}));
 amodal(`<h3>Consolidated multi-depot report</h3><p class="mut">Only the depots and dates ticked below are for the day. Depots are never merged into one another — each depot is calculated separately, then listed side by side.</p>
 <div class="cols2"><fieldset><legend>Depots</legend>${APP.depots.map(d=>{const has=(APP.reports[d.id]||[]).some(r=>r.status==='Processed');return `<label class="ck"><input type="checkbox" data-cons="dep" value="${esc(d.id)}" ${CONS.deps.has(d.id)?'checked':''} ${has?'':'disabled'}> ${esc(d.name)}${has?'':' <em>(no report)</em>'}</label>`}).join('')}</fieldset>
 <fieldset><legend>Dates <button class="lnk" data-act="consall">all</button> <button class="lnk" data-act="consnone">none</button></legend><div class="dlist">${dates.map(dt=>`<label class="ck"><input type="checkbox" data-cons="date" value="${dt}" ${CONS.dates.has(dt)?'checked':''}> ${dmy(dt)}</label>`).join('')||'<em>Select a depot</em>'}</div></fieldset></div>
 <p><b>${pairs}</b> depot-date report${pairs===1?'':'s'} selected.</p>
 <p class="mact"><button class="pri" data-act="consxl" ${pairs?'':'disabled'}>Download Excel</button><button data-act="conspdf" ${pairs?'':'disabled'}>Download PDF (print)</button><button data-act="close">Close</button></p>`);
}
/* ---------- NAVIGATION (depot selector + #/depot/<id>) ---------- */
function showDepot(id){
 const d=depot(id);if(!d)return;
 APP.cur=id;
 document.title=d.name+' – CHAKRA E-TRANS';
 const s=APP.sel[id];
 loadDepot({depot:d,reports:APP.reports[id]||[],fleet:APP.fleet[id]||null,ctx:Engine.makeCtx(d.config),date:s==='ALL'?'':s});
}
function route(){
 const m=location.hash.match(/^#\/depot\/(.+)$/);let id=m?decodeURIComponent(m[1]):null;
 if(!id||!depot(id)){id=APP.depots[0]&&APP.depots[0].id}
 if(id)showDepot(id);
}
function openDepot(id,date){
 if(date)APP.sel[id]=date;saveSel();const h='#/depot/'+encodeURIComponent(id);if(location.hash===h)route();else location.hash=h;
}

/* ---------- EVENT WIRING ---------- */
function wire(){
 $('#am').addEventListener('click',async e=>{
  if(e.target===$('#am')){closeAm();return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id,dt=b.dataset.date;
  if(act==='close')closeAm();
  else if(act==='hview'){closeAm();openDepot(id,dt)}
  else if(act==='hrepl'){closeAm();pickUpload(dt)}
  else if(act==='hdel'){closeAm();await removeReport(id,dt);historyModal(id)}
  else if(act==='savesettings')saveSettings(id);
  else if(act==='adddepot')addDepot();
  else if(act==='consall'){CONS.dates=new Set(consDates());renderCons()}
  else if(act==='consnone'){CONS.dates=new Set();renderCons()}
  else if(act==='consxl'||act==='conspdf'){const deps=[...CONS.deps],dates=[...CONS.dates];busy(true,'Building consolidated report…');try{await tick();if(act==='consxl')await consolidatedExcel(deps,dates);else{closeAm();await consolidatedPdf(deps,dates)}}catch(x){toast('Report failed: '+x.message,'err')}finally{busy(false)}}
 });
 $('#am').addEventListener('change',e=>{const c=e.target.dataset.cons;if(!c)return;
  if(c==='dep'){e.target.checked?CONS.deps.add(e.target.value):CONS.deps.delete(e.target.value);CONS.dates=CONS.dates===null?null:CONS.dates}
  else{e.target.checked?CONS.dates.add(e.target.value):CONS.dates.delete(e.target.value)}
  renderCons()});
 $('#consBtn').onclick=consolidatedModal;$('#addBtn').onclick=addDepotModal;
 /* upload / history / remove (action bar) */
 $('#bUp').onclick=()=>pickUpload();
 $('#dorFile').onchange=e=>{const f=e.target.files[0],ex=EXPECT;e.target.value='';EXPECT=null;if(f&&APP.cur)handleUpload(APP.cur,f,ex)};
 $('#bHist').onclick=()=>historyModal(APP.cur);
 $('#bRem').onclick=()=>{const dt=S.f.date;if(!dt){toast('Select a single reporting date in the date filter first, then click Remove.','warn');return}
  if(!(APP.reports[APP.cur]||[]).some(r=>r.date===dt)){toast('There is no report for that date.','warn');return}removeReport(APP.cur,dt)};
 /* dashboard toolbar */
 $('#bXl').onclick=xl;$('#bDates').onclick=xlDates;$('#bDest').onclick=()=>xlSet('dest');$('#bBus').onclick=()=>xlSet('bus');$('#bDrv').onclick=()=>xlSet('drv');$('#bDq').onclick=()=>xlSet('dq');
 $('#bPdf').onclick=()=>pr(true);$('#bPdfTab').onclick=()=>pr(false);
 $('#bSet').onclick=()=>settingsModal(S.depot.id);
 bindDashboardInputs();
 addEventListener('hashchange',route);
 addEventListener('keydown',e=>{if(e.key==='Escape'){closeAm();$('#md').style.display='none'}});
}
/* dashboard → app hooks */
Hooks.onDate=v=>{if(!S.depot)return;APP.sel[S.depot.id]=v||'ALL';saveSel()};
Hooks.onMap=async rep=>{const d=depot(rep.depotId);Engine.evaluate(rep,Engine.makeCtx(d.config),fleetSizeOf(d.id));await Store.saveReport(rep);bump(d.id)};
Hooks.onFleet=async arr=>{const id=S.depot.id;if(arr&&arr.length){APP.fleet[id]=arr;await Store.setMeta('fleet:'+id,arr)}else{delete APP.fleet[id];await Store.delMeta('fleet:'+id)}
 await recomputeDepot(id)};

/* ---------- STARTUP ---------- */
async function init(){
 busy(true,'Loading…');
 try{
  await Store.init();
  let ds=await Store.depots();
  if(!ds.length){ds=[{id:'karimnagar-depot-2',name:'Karimnagar Depot 2',order:1,config:Engine.defaultConfig()}];for(const d of ds)await Store.saveDepot(d)}
  ds.sort((a,b)=>(a.order||0)-(b.order||0));APP.depots=ds;
  ds.forEach(d=>{d.config=Object.assign(Engine.defaultConfig(),d.config||{});APP.reports[d.id]=[]});
  (await Store.allReports()).forEach(r=>{(APP.reports[r.depotId]=APP.reports[r.depotId]||[]).push(r)});
  Object.values(APP.reports).forEach(l=>l.sort((a,b)=>a.date<b.date?-1:1));
  for(const d of ds){const f=await Store.getMeta('fleet:'+d.id);if(f&&f.length)APP.fleet[d.id]=f}
  ds.forEach(d=>{APP.sel[d.id]=defaultSel(d.id)});
  wire();route();
 }catch(e){toast('Startup problem: '+e.message,'err',10000)}
 finally{busy(false)}
}
init();

</script>

<script>
/* entity-report.js — search a Bus No. / Service (Route) No. / Driver ID and get its complete report
   (summary, KPIs, leg-by-leg log, day-wise, related-entity breakdown, loss, odometer, data issues) with Excel + PDF export.
   Uses the same rows, filters and K() engine as the rest of the dashboard — no new business logic. */
(function(){
'use strict';
const TY={bus:['Bus',r=>r.bus],svc:['Service',r=>r.svc],drv:['Driver',r=>String(r.drv||'').toUpperCase()]};
const base=()=>S.rows.filter(r=>!(CFG.nodup&&r.dup));
const dts=()=>[...new Set(base().map(r=>r.date))].sort();
const addD=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const scope=per=>base().filter(r=>r.date>=per.from&&r.date<=per.to);
const plabel=per=>per.from===per.to?dmy(per.from):dmy(per.from)+' to '+dmy(per.to);
/* period presets: Selected day / Today / Latest day / Last 7 days / All days / Custom from–to */
function mkPer(mode){
 const ds=dts(),first=ds[0]||'',last=ds[ds.length-1]||'';
 if(mode==='sel')return{mode,from:S.f.date,to:S.f.date};
 if(mode==='today')return{mode,from:todayISO(),to:todayISO()};
 if(mode==='latest')return{mode,from:last,to:last};
 if(mode==='l7')return{mode,from:addD(last,-6),to:last};
 if(mode==='custom'){let a=$('#pf')&&$('#pf').value||first,b=$('#pto')&&$('#pto').value||last;if(a>b)[a,b]=[b,a];return{mode,from:a,to:b}}
 return{mode:'all',from:first,to:last};
}
let ENT=null;

/* ---------- search ---------- */
function fillList(){
 const dl=document.getElementById('eql');if(!dl||!S.depot)return;
 const v=new Set();base().forEach(r=>[r.bus,r.svc,r.drv].forEach(x=>{if(x)v.add(String(x))}));
 dl.innerHTML=[...v].sort().map(x=>`<option value="${esc(x)}">`).join('');
}
function find(q){
 q=q.trim().toUpperCase();const rs=base(),out={exact:[],part:[]};
 for(const t in TY){const m=new Map();rs.forEach(r=>{const v=TY[t][1](r);if(!v)return;if(!m.has(v))m.set(v,0);m.set(v,m.get(v)+1)});
  m.forEach((n,v)=>{if(v===q)out.exact.push({t,k:v,n});else if(v.includes(q))out.part.push({t,k:v,n})})}
 return out}
function go(){
 if(!S.depot||!S.rows.length){toast('No report data loaded for this depot/date.','warn');return}
 const q=$('#eq').value;if(!q.trim()){toast('Type a bus number, service number or driver ID.','warn');return}
 const f=find(q);
 if(f.exact.length===1)return open(f.exact[0].t,f.exact[0].k);
 if(!f.exact.length&&f.part.length===1)return open(f.part[0].t,f.part[0].k);
 const l=f.exact.length?f.exact:f.part.slice(0,60);
 if(!l.length){toast(`No bus, service or driver matching "${q.trim()}" in the loaded reports.`,'warn');return}
 $('#mb').innerHTML=`<div class="er"><h2>${f.exact.length?'"'+esc(q.trim())+'" matches more than one record type':'No exact match for "'+esc(q.trim())+'" – did you mean:'}</h2><p class="mut">Pick one to open its full report${!f.exact.length&&f.part.length>60?' (showing first 60 of '+f.part.length+')':''}.</p><div class="chs">${l.map(x=>`<button class="chip ok" data-et="${x.t}" data-ek="${esc(x.k)}">${TY[x.t][0]} · ${esc(x.k)} <small>(${x.n} legs)</small></button>`).join('')}</div><p><button onclick="$('#md').style.display='none'">Close</button></p></div>`;
 $('#md').style.display='flex';
}

/* ---------- model ---------- */
const dly=r=>{if(!r.op||r.sT==null||r.aT==null)return'';let d=r.aT-r.sT;if(d<-720)d+=1440;if(d>720)d-=1440;return d};
const lst=r=>!r.op?'Not operated':(r.aKm<(r.sKm||0)-1?'Partial':'Operated');
const dff=r=>r.op&&r.odo!=null?+(r.aKm-r.odo).toFixed(1):'';
const oflag=r=>{if(!r.op)return'';if(r.odo==null)return'Missing odometer';const d=r.aKm-r.odo;return Math.abs(d)>CFG.abn?'Abnormal':d>CFG.tol?'Act > Odo':d<-CFG.tol?'Act < Odo':'OK'};
const LOG=[['Date',r=>dmy(r.date)],['Row',r=>String(r.i)],['Service',r=>r.svc],['Bus',r=>r.bus],['Driver',r=>r.drv||'—'],['Route',r=>r.routes],['Dest',r=>r.dest],['Dir',r=>r.dir],['Shift',r=>r.shift],['Sch start',r=>hm(r.sT)],['Act start',r=>hm(r.aT)],['Delay (min)',r=>dly(r)],['Sch Km',r=>r.sKm??0],['Act Km',r=>r.aKm??0],['Loss Km',r=>lk(r)],['Odo Km',r=>r.odo==null?'—':r.odo],['Act−Odo',r=>dff(r)],['Status',lst],['Reason',r=>r.reason],['Issues',r=>r.is.join('; ')]];
const LOSSC=[['Date',r=>dmy(r.date)],['Row',r=>String(r.i)],['Service',r=>r.svc],['Bus',r=>r.bus],['Driver',r=>r.drv||'—'],['Dest',r=>r.dest],['Dir',r=>r.dir],['Sch start',r=>hm(r.sT)],['Sch Km',r=>r.sKm??0],['Act Km',r=>r.aKm??0],['Loss Km',r=>lk(r)],['Status',lst],['Reason',r=>r.reason||'(not given)']];
const ODOC=[['Date',r=>dmy(r.date)],['Row',r=>String(r.i)],['Bus',r=>r.bus],['Service',r=>r.svc],['Act Km',r=>r.aKm??0],['Odo Km',r=>r.odo==null?'—':r.odo],['Act−Odo',r=>dff(r)],['Flag',oflag]];
const ISSC=[['Date',r=>dmy(r.date)],['Row',r=>String(r.i)],['Service',r=>r.svc],['Bus',r=>r.bus],['Driver',r=>r.drv||'—'],['Issues',r=>r.is.join('; ')]];
const BK=['Legs',...[]];
function model(t,k,per){
 const f=TY[t][1],rs=scope(per).filter(r=>f(r)===k).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.i-b.i);
 const kp=K(rs),dates=[...new Set(rs.map(r=>r.date))],dd=rs.map(dly).filter(x=>x!==''),avgD=dd.length?sum(dd,x=>x)/dd.length:null;
 const lossy=rs.filter(r=>!r.op||lk(r)>0),odoEx=rs.filter(r=>!['','OK'].includes(oflag(r))),iss=rs.filter(r=>r.is.length);
 const prof=[['Depot',S.depot.name],['Reporting period',`${plabel(per)} (${dates.length} day${dates.length===1?'':'s'} with data)`],['Legs in DOR',rs.length],
  ...['bus','svc','drv'].filter(x=>x!==t).map(x=>[TY[x][0]+'(s)',uniq(rs,r=>TY[x][1](r))||'—']),
  ['Route(s)',uniq(rs,r=>r.routes)||'—'],['Category',uniq(rs,r=>r.cat)||'—'],['Bus model',uniq(rs,r=>r.model)||'—'],['Shift',uniq(rs,r=>r.shift)||'—'],['Destination(s)',uniq(rs,r=>r.dest)||'—'],
  ['Days operated',`${new Set(rs.filter(r=>r.op).map(r=>r.date)).size} of ${dates.length}`]];
 const all=gd(scope(per),r=>f(r)||'(missing)',[]).data,met=t==='svc'?x=>x.lossKm:x=>x.oKm;all.sort((a,b)=>met(b)-met(a));
 const idx=all.findIndex(x=>f(x.l[0])===k),act=all.filter(x=>x.opLegs),avg=act.length?sum(act,x=>x.oKm)/act.length:0;
 const rank=idx<0?'':t==='svc'?`Ranks #${idx+1} of ${all.length} services by km loss (highest loss = #1).`:`Ranks #${idx+1} of ${all.length} ${TY[t][0].toLowerCase()}s by operated km (average ${n0(avg)} km per ${TY[t][0].toLowerCase()} that operated).`;
 const reasons=uniq(lossy,r=>r.reason);
 const sm=`<b>${esc(TY[t][0])} ${esc(k)}</b> had <b>${rs.length}</b> scheduled leg(s); <b>${kp.opLegs}</b> operated. Completed <b>${kp.opT}</b> of <b>${kp.schT}</b> round trips (<b class="${kp.lossT?'r':'g'}">${kp.lossT}</b> lost). Operated <b>${n0(kp.oKm)}</b> of <b>${n0(kp.sKm)}</b> scheduled km; <b class="${kp.lossKm?'r':'g'}">${n0(kp.lossKm)}</b> km lost${reasons?` (reason: ${esc(reasons)})`:''}. `+
  `Odometer ${n0(kp.odo)} km vs actual ${n0(kp.oKm-sum(rs.filter(r=>r.odo==null),r=>r.aKm))} km (difference ${kp.diff>=0?'+':''}${n0(kp.diff)}). `+(avgD==null?'':`Average start delay ${avgD>=0?'+':''}${avgD.toFixed(0)} min (+ = late). `)+(iss.length?`<b class="r">${iss.length}</b> record(s) need verification. `:'No data-quality issues. ')+esc(rank);
 const sc=[['Legs',k=>k.n],...KC.slice(0,7)],bcols=o=>[[TY[o][0],x=>TY[o][1](x.l[0])||'(missing)'],['Shift',x=>uniq(x.l,r=>r.shift)],['Destination',x=>uniq(x.l,r=>r.dest)],...sc,ST];
 const brk=['bus','svc','drv'].filter(x=>x!==t).map(o=>({o,label:TY[o][0]+'-wise',cols:bcols(o),data:gd(rs,r=>TY[o][1](r)||'(missing)',[]).data}));
 const days=dates.length>1?{cols:[['Date',x=>dmy(x.l[0].date)],...sc,KC[7],ST],data:gd(rs,r=>r.date,[]).data}:null;
 return{t,k,per,rs,kp,dates,avgD,prof,sm,rank,brk,days,lossy,odoEx,iss,nOdoOk:rs.filter(r=>oflag(r)==='OK').length};
}

/* ---------- HTML ---------- */
const cell=(l,v)=>/^(Status|Flag)$/.test(l)?(/^(Fully|Operated|OK|Within)/.test(v)?'s-ok':/Not|Missing|Verif|Abnormal|Zero/.test(v)?'s-bad':v?'s-w':''):'';
const st=(cols,data)=>!data.length?'<p class="mut">None.</p>':`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${cols.map(c=>{const v=c[1](r);return typeof v==='number'?`<td class="n">${n0(v)}</td>`:`<td class="${cell(c[0],v)}">${v===''||v==null?'-':esc(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
const kc=(l,v,c='')=>`<div class="kc ${c}"><small>${l}</small><b>${v}</b></div>`;
function html(m){
 const k=m.kp,sgn=x=>(x>=0?'+':'')+n0(x);
 const head=`<div class="eh"><div><h2><span class="tag">${TY[m.t][0].toUpperCase()}</span>${esc(m.k)} – Complete Report</h2><div class="sub">${esc(S.depot.name)} · Period: <b>${esc(plabel(m.per))}</b> · generated ${esc(new Date().toLocaleString('en-IN'))}</div></div></div>`;
 if(!m.rs.length)return head+`<div class="okn" style="color:var(--w)">No records for ${TY[m.t][0].toLowerCase()} ${esc(m.k)} in ${esc(plabel(m.per))}. Pick another period above.</div>`;
 return head+
 `<h4>Summary</h4><div class="sm">${m.sm}</div>`+
 `<h4>Key figures</h4><div class="kg">${kc('Scheduled trips',n0(k.schT))}${kc('Operated trips',n0(k.opT),'ok')}${kc('Loss trips',n0(k.lossT),k.lossT?'bad':'')}${kc('Scheduled KMs',n0(k.sKm))}${kc('Operated KMs',n0(k.oKm),'ok')}${kc('Loss KMs',n0(k.lossKm),k.lossKm?'bad':'')}${kc('Odometer KMs',n0(k.odo))}${kc('Actual − Odo',sgn(k.diff),Math.abs(k.diff)>CFG.tol?'bad':'')}${kc('Avg start delay',m.avgD==null?'–':sgn(Math.round(m.avgD))+' min')}${k.soc?kc('SOC consumed (sum of legs)',n0(k.soc)):''}${kc('Status',esc(k.st),'st '+(/^Fully/.test(k.st)?'ok':/Not|Missing|Verif/.test(k.st)?'bad':''))}</div>`+
 `<h4>Profile</h4><div class="pf">${m.prof.map(p=>`<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join('')}</div>`+
 `<h4>Leg-by-leg log (${m.rs.length})</h4>${st(LOG,m.rs)}`+
 (m.days?`<h4>Day-wise</h4>${st(m.days.cols,m.days.data)}`:'')+
 m.brk.map(b=>`<h4>${b.label} breakdown</h4>${st(b.cols,b.data)}`).join('')+
 `<h4>Loss analysis (${m.lossy.length} leg${m.lossy.length===1?'':'s'} with loss)</h4>${m.lossy.length?st(LOSSC,m.lossy):'<div class="okn">✓ No km loss – every scheduled leg fully operated.</div>'}`+
 `<h4>Odometer check (tolerance ${CFG.tol} km, abnormal > ${CFG.abn} km)</h4>${m.odoEx.length?st(ODOC,m.odoEx)+`<p class="mut">${m.nOdoOk} other operated leg(s) are within tolerance.</p>`:'<div class="okn">✓ All operated legs have odometer within tolerance.</div>'}`+
 `<h4>Data issues (${m.iss.length})</h4>${m.iss.length?st(ISSC,m.iss):'<div class="okn">✓ No data-quality issues on these records.</div>'}`;
}

/* ---------- open / export / print ---------- */
const tabs=per=>{const ds=dts(),first=ds[0]||'',last=ds[ds.length-1]||'',T=[];
 if(S.f.date)T.push(['sel','Selected day · '+dmy(S.f.date)]);
 if(ds.includes(todayISO()))T.push(['today','Today']);else if(S.f.date!==last)T.push(['latest','Latest day · '+dmy(last)]);T.push(['l7','Last 7 days'],['all','All days']);
 return `<div class="ptabs">${T.map(([m,l])=>`<button class="pt ${per.mode===m?'on':''}" data-ep="${m}">${l}</button>`).join('')}<span class="pc ${per.mode==='custom'?'on':''}">From <input type="date" id="pf" min="${first}" max="${last}" value="${per.mode==='custom'?per.from:first}" aria-label="From date"> to <input type="date" id="pto" min="${first}" max="${last}" value="${per.mode==='custom'?per.to:last}" aria-label="To date"><button data-ep="custom">Apply</button></span></div>`};
function open(t,k,per){
 per=per||mkPer(S.f.date?'sel':'all');const m=model(t,k,per);ENT={t,k,per};
 $('#mb').innerHTML=`<div class="er"><div class="ehd np">${tabs(per)}<div class="tbar"><button class="pri" data-ea="xl">Export Excel</button><button data-ea="pdf">Print / PDF</button><button onclick="$('#md').style.display='none'">Close</button></div></div>${html(m)}</div>`;
 $('#md').style.display='flex';$('#mb').scrollTop=0;
}
function exportXl(){
 if(!ENT)return;const m=model(ENT.t,ENT.k,ENT.per),k=m.kp,wb=XLSX.utils.book_new();
 addSheet(wb,'Summary',[[`${TY[m.t][0]} ${m.k} – complete report`],['Depot',S.depot.name],['Period',plabel(m.per)],[],...m.prof.map(p=>[p[0],p[1]]),[],['Scheduled trips',k.schT],['Operated trips',k.opT],['Loss trips',k.lossT],['Scheduled KMs',k.sKm],['Operated KMs',k.oKm],['Loss KMs',k.lossKm],['Odometer KMs',k.odo],['Actual − Odo',k.diff],['Avg start delay (min)',m.avgD==null?'':+m.avgD.toFixed(1)],['Status',k.st],[],['Summary',m.sm.replace(/<[^>]+>/g,'')]]);
 addSheet(wb,'Leg log',aoa(LOG,m.rs));
 if(m.days)addSheet(wb,'Day-wise',aoa(m.days.cols,m.days.data));
 m.brk.forEach(b=>addSheet(wb,b.label,aoa(b.cols,b.data)));
 addSheet(wb,'Loss',aoa(LOSSC,m.lossy));addSheet(wb,'Odometer exceptions',aoa(ODOC,m.odoEx));addSheet(wb,'Data issues',aoa(ISSC,m.iss));
 XLSX.writeFile(wb,`${TY[m.t][0]}_${String(m.k).replace(/[^A-Za-z0-9_-]/g,'')}_${slug(S.depot.name)}_${m.per.from}_to_${m.per.to}.xlsx`);
}
function printIt(){
 if(!ENT)return;const m=model(ENT.t,ENT.k,ENT.per);
 $('#printArea').innerHTML=`<div class="er"><h1>CHAKRA E-TRANS</h1>${html(m)}</div>`;
 document.body.classList.add('print-cons','print-ent');
 const done=()=>{document.body.classList.remove('print-cons','print-ent');$('#printArea').innerHTML='';window.removeEventListener('afterprint',done)};
 window.addEventListener('afterprint',done);setTimeout(()=>{print();setTimeout(done,1500)},150);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-et]');if(b){open(b.dataset.et,b.dataset.ek);return}
 const pb=e.target.closest('[data-ep]');if(pb&&ENT){open(ENT.t,ENT.k,mkPer(pb.dataset.ep));return}
 const a=e.target.closest('[data-ea]');if(a){a.dataset.ea==='xl'?exportXl():printIt()}});
const _f=window.filters;window.filters=function(){const r=_f.apply(this,arguments);fillList();return r};
$('#eGo').onclick=go;$('#eq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
window.EntReport={model,html,find,scope,open,mkPer};
})();
</script>

</body></html>
